[project]
name = "pipeline"
version = "0.1.0"
description = "Staged CPU NLP pipeline: PDF -> keyphrases, topic label, one-sentence summary."
requires-python = ">=3.11"
dependencies = [
    "pymupdf==1.28.2",
    "spacy==3.8.16",
    "scikit-learn==1.9.0",
    "keybert==0.9.0",
    "torch==2.13.0",
    "transformers==5.16.1",
    "llama-cpp-python==0.3.35",
    "onnxruntime==1.29.0",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
markers = [
    "slow: model-backed tests, not run by default",
]
